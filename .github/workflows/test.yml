name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. コードをチェックアウト
      - uses: actions/checkout@v4

      # 2. Javaのセットアップ（バージョンをv4に上げてNode.js 24警告を解消）
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Flutterのセットアップ
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false # 💡 一旦キャッシュをオフにして、まっさらな状態でテストする

      # 4. パッケージ取得
      - name: Install dependencies
        run: flutter pub get

      # 5. 【重要】古いビルドゴミを消去する
      - name: Clean build
        run: flutter clean
        
      # 6. 静的解析（エラーがあっても次に進むように設定）
      - name: Analyze code
        run: flutter analyze || true  # 💡 「|| true」をつけることで、警告があってもテストへ進みます

      # 7. テスト実行
      - name: Run tests
        run: flutter test