name: 🚀 開発タスク
description: 新機能の追加やドキュメント更新などの作業用
title: "[Task]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 📝 作業の概要
        何を、なぜ変更するのかを簡潔に書いてください。
  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ やることリスト
      options:
        - label: コードの修正 / ドキュメントの更新
        - label: ローカルでの動作確認
        - label: (あれば) テストコードの更新
  - type: textarea
    id: notes
    attributes:
      label: 📌 備考・メモ
      placeholder: 参考にしたサイトのURLや、注意点などがあれば。